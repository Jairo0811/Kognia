name: Apply Eliandres academic clarification

on:
  push:
    branches:
      - docs/clarify-eliandres-iso815

permissions:
  contents: write

jobs:
  update-readme:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/clarify-eliandres-iso815
          fetch-depth: 0

      - name: Clarify Eliandres ISO-815 scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '| Francis Jairo Matias Rosario | A00115261 |\n| Eliandres Rodriguez Cepeda | A00112070 |\n| Ramon Rosario Rodriguez | A00110961 |',
              '| 👨🏻‍💻 Francis Jairo Matias Rosario | A00115261 |\n| 👨🏻‍💻 Eliandres Rodriguez Cepeda | A00112070 |\n| 👨🏻‍💻 Ramon Rosario Rodriguez | A00110961 |'
          )

          text = text.replace(
              'Posteriormente, ambos vuelven a coincidir durante **Septiembre - Diciembre 2026** en dos proyectos distintos y paralelos de **Integración de Aplicaciones con Tecnología Open Source (ISO-815)**: [**SOAForge**](https://github.com/Jairo0811/SOA-Forge) y [**BonitaSoft**](https://github.com/Jairo0811/BonitaSoft).',
              'Posteriormente, ambos vuelven a coincidir durante **Septiembre - Diciembre 2026** en dos proyectos distintos y paralelos de **Integración de Aplicaciones con Tecnología Open Source (ISO-815)**: el **track ISO-815** de [**SOAForge**](https://github.com/Jairo0811/SOA-Forge) y [**BonitaSoft**](https://github.com/Jairo0811/BonitaSoft). **Esta referencia a SOAForge corresponde únicamente a ISO-815; Eliandres no forma parte de ISO-810.**'
          )

          text = text.replace(
              '| 2 | Integración de Aplicaciones con Tecnología Open Source (ISO-815) | [**SOAForge**](https://github.com/Jairo0811/SOA-Forge) | Septiembre - Diciembre 2026 |',
              '| 2 | Integración de Aplicaciones con Tecnología Open Source (ISO-815) | [**SOAForge — track ISO-815**](https://github.com/Jairo0811/SOA-Forge) | Septiembre - Diciembre 2026 |'
          )

          text = text.replace(
              '> **Alcance de Eliandres:** su participación en 2026 corresponde exclusivamente a **ISO-815**. **Eliandres Rodriguez Cepeda no pertenece a ISO-810**.',
              '> **Alcance de Eliandres:** en 2026 participa exclusivamente en **ISO-815**, tanto en **SOAForge — track ISO-815** como en **BonitaSoft**. **Eliandres Rodriguez Cepeda no participa ni pertenece al equipo de ISO-810.**'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: clarify Eliandres ISO-815 continuity"
          git push origin HEAD:docs/clarify-eliandres-iso815
