services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kognia-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${KOGNIA_SA_PASSWORD:-Kognia_Local_2026!}"
    ports:
      - "14330:1433"
    volumes:
      - kognia-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kognia-sql-data:
