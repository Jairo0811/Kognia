services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}"
    volumes:
      - kognia-sql:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__KogniaConnection: "Server=sqlserver,1433;Database=KogniaDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Issuer: "${JWT_ISSUER:-Kognia}"
      Jwt__Audience: "${JWT_AUDIENCE:-Kognia.Web}"
      Jwt__Key: "${JWT_KEY:?Set a strong JWT_KEY of at least 32 characters}"
      Security__AllowedOrigins__0: "${PUBLIC_ORIGIN:-http://localhost:8080}"
    expose:
      - "8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  kognia-sql:
